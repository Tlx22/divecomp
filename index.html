<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dive Computer Simulator — Real Arduino Engine</title>
<style>
/* Same beautiful style as your screenshot */
:root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --border-color: #30363d;
    --accent-color: #58a6ff;
    --text-color: #c9d1d9;
    --oled-bg: #000000;
    --oled-blue: #00d2ff;
    --oled-yellow: #ffcc00;
    --oled-alert: #ff4444;
}
body { margin:0; padding:20px; background:var(--bg-color); color:var(--text-color); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace; display:flex; flex-direction:column; gap:20px; }
h1,h2,h3 { margin:0 0 10px 0; color:#fff; }
.grid-container { display:grid; grid-template-columns:320px 1fr 340px; gap:20px; }
.card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:15px; }
.device-housing { background:#21262d; border:3px solid #484f58; border-radius:20px; padding:20px; display:flex; flex-direction:column; align-items:center; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
.oled-screen { width:256px; height:128px; background:var(--oled-bg); border:2px solid #30363d; border-radius:4px; padding:8px; box-sizing:border-box; font-family:'Courier New',Courier,monospace; color:var(--oled-blue); display:flex; flex-direction:column; justify-content:space-between; user-select:none; position:relative; }
.oled-screen.alarm { border-color:var(--oled-alert); animation:flash 0.5s infinite alternate; }
@keyframes flash { from { box-shadow:0 0 5px var(--oled-alert); } to { box-shadow:0 0 20px var(--oled-alert); } }
.oled-header { display:flex; justify-content:space-between; font-size:12px; color:var(--oled-yellow); border-bottom:1px solid #333; padding-bottom:2px; }
.oled-main { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin:5px 0; }
.oled-value { font-size:20px; font-weight:bold; }
.oled-label { font-size:10px; color:#888; }
.oled-footer { font-size:11px; color:var(--oled-yellow); border-top:1px solid #333; padding-top:2px; display:flex; justify-content:space-between; }
.hardware-buttons { display:flex; justify-content:space-between; width:100%; margin-top:20px; }
.btn-hw { background:#30363d; color:white; border:2px solid #6e7681; border-radius:50%; width:50px; height:50px; font-weight:bold; cursor:pointer; transition:active 0.1s; }
.btn-hw:active { background:var(--accent-color); transform:scale(0.95); }
.control-group { display:flex; flex-direction:column; gap:10px; margin-bottom:15px; }
label { font-size:12px; font-weight:bold; }
input[type=range] { width:100%; }
button.btn-action { background:#238636; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold; }
.code-editor { width:100%; height:240px; background:#0d1117; color:#79c0ff; border:1px solid var(--border-color); border-radius:6px; padding:10px; box-sizing:border-box; resize:vertical; font-family:'Fira Code',monospace; }
.debug-log { height:220px; background:#000; color:#3fb950; padding:10px; border-radius:6px; overflow-y:auto; border:1px solid var(--border-color); }
.debug-item { margin-bottom:4px; border-bottom:1px dotted #222; }
</style>
</head>
<body>

<h1>🤿 Dive Computer Simulator — Real Arduino Engine</h1>

<div class="grid-container">

    <!-- COLUMN 1 -->
    <div class="card">
        <h3>Hardware Frame</h3>
        <div class="device-housing">
            <div id="oledScreen" class="oled-screen">
                <div class="oled-header">
                    <span id="screenMode">SURFACE</span>
                    <span id="screenAlgo">Buhlmann</span>
                </div>
                <div class="oled-main">
                    <div><div class="oled-label">DEPTH (m)</div><div id="dispDepth" class="oled-value">0.0</div></div>
                    <div><div class="oled-label">NDL (min)</div><div id="dispNDL" class="oled-value">99</div></div>
                    <div><div class="oled-label">DIVE TIME</div><div id="dispTime" class="oled-value">00:00</div></div>
                    <div><div class="oled-label">TEMP (°C)</div><div id="dispTemp" class="oled-value">26.0</div></div>
                </div>
                <div class="oled-footer">
                    <span id="dispStop">NO DECO</span>
                    <span id="dispTTS">TTS: 0m</span>
                </div>
            </div>

            <div class="hardware-buttons">
                <button class="btn-hw" onclick="pressButton('SELECT')">SEL</button>
                <button class="btn-hw" onclick="pressButton('UP')">▲</button>
                <button class="btn-hw" onclick="pressButton('DOWN')">▼</button>
            </div>
        </div>

        <div style="margin-top:15px;">
            <label>🔊 Audio Alert Test (Buzzer)</label>
            <button class="btn-action" style="background:#d29922;width:100%;" onclick="playBuzzer(1000,200)">Trigger Alert Tone</button>
        </div>
    </div>

    <!-- COLUMN 2 -->
    <div class="card">
        <h3>Environment & Speed Controls</h3>

        <div class="control-group" style="background:#21262d;padding:10px;border-radius:6px;">
            <label>Playback Speed</label>
            <div style="display:flex;gap:8px;">
                <button class="btn-action" onclick="setSpeed(1)">1x</button>
                <button class="btn-action" onclick="setSpeed(2)">2x</button>
                <button class="btn-action" onclick="setSpeed(4)">4x</button>
                <button class="btn-action" onclick="setSpeed(60)" style="background:#f85149;">60x</button>
                <button class="btn-action" style="background:#f85149;" onclick="resetDive()">Reset Dive</button>
            </div>
        </div>

        <div class="control-group">
            <label>Depth: <span id="valDepth">0.0</span> m</label>
            <input type="range" id="sliderDepth" min="0" max="60" step="0.5" value="0" oninput="updateDepth(this.value)">
        </div>

        <div class="control-group">
            <label>Time Elapsed: <span id="valTime">0</span> min</label>
            <input type="range" id="sliderTime" min="0" max="120" step="1" value="0" oninput="updateTime(this.value)">
        </div>

        <div class="control-group">
            <label>Water Temp: <span id="valTemp">26</span> °C</label>
            <input type="range" id="sliderTemp" min="4" max="35" step="1" value="26" oninput="updateTemp(this.value)">
        </div>

        <div class="control-group">
            <label>Fo2 %</label>
            <input type="range" id="sliderFo2" min="21" max="40" step="1" value="21" oninput="updateFo2(this.value)">
            <span id="valFo2">21</span>%
        </div>

        <div class="control-group">
            <label>Gradient Factor (GF)</label>
            <input type="range" id="sliderGF" min="30" max="70" step="1" value="70" oninput="updateGF(this.value)">
            <span id="valGF">0.70</span>
        </div>
    </div>

    <!-- COLUMN 3 -->
    <div class="card">
        <h3>Real Arduino Engine (WebSerial)</h3>
        <button class="btn-action" onclick="connectToArduino()">🔗 CONNECT TO ARDUINO (WebSerial)</button>
        <button class="btn-action" style="background:#f85149;" onclick="resetDive()">Reset Dive</button>

        <h3 style="margin-top:20px;">Debug Log</h3>
        <div id="debugLog" class="debug-log">
            <div class="debug-item">System booted. Bühlmann ZHL-16C engine initialized...</div>
        </div>
    </div>
</div>

<script>
// ==================== REAL ARDUINO ENGINE (WebSerial) ====================
let arduino = null;

async function connectToArduino() {
    if (!navigator.serial) {
        alert("WebSerial not supported in this browser (try Chrome/Edge)");
        return;
    }
    try {
        arduino = await navigator.serial.requestPort();
        await arduino.open({ baudRate: 115200 });
        logDebug("✅ Connected to Arduino! Real firmware engine running.");
        readLoop();
    } catch(e) { logDebug(`Connection error: ${e.message}`); }
}

function readLoop() {
    if (!arduino) return;
    const reader = arduino.readable.getReader();
    reader.read().then(function processText({value, done}) {
        if (done) return;
        const text = new TextDecoder().decode(value);
        const lines = text.split('\n');
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            // Parse real output from your Arduino
            if (line.includes("DEPTH (m)")) {
                const d = line.match(/\d+\.\d+/)?.[0] || "0.0";
                document.getElementById('dispDepth').innerText = d;
            }
            if (line.includes("NDL (min)")) {
                const ndl = line.match(/\d+/)?.[0] || "99";
                document.getElementById('dispNDL').innerText = ndl;
            }
            if (line.includes("DIVE TIME")) {
                const timeMatch = line.match(/(\d+):(\d+)/);
                if (timeMatch) {
                    document.getElementById('dispTime').innerText = timeMatch[1].padStart(2,'0') + ':' + timeMatch[2].padStart(2,'0');
                }
            }
            if (line.includes("TEMP")) {
                const t = line.match(/\d+\.\d+/)?.[0] || "26.0";
                document.getElementById('dispTemp').innerText = t;
            }
            if (line.includes("NO DECO") || line.includes("STOP")) {
                document.getElementById('dispStop').innerText = line;
            }
            if (line.includes("TTS:")) {
                document.getElementById('dispTTS').innerText = line;
            }
        }
        reader.read().then(processText);
    });
}

// ==================== UI Controls ====================
function updateDepth(v){ document.getElementById('valDepth').innerText = parseFloat(v).toFixed(1); }
function updateTime(v){ document.getElementById('valTime').innerText = Math.floor(parseFloat(v)); }
function updateTemp(v){ document.getElementById('valTemp').innerText = parseFloat(v).toFixed(1); }
function updateFo2(v){ document.getElementById('valFo2').innerText = v + '%'; }
function updateGF(v){ document.getElementById('valGF').innerText = (v/100).toFixed(2); }
function setSpeed(s){ /* speed simulation is handled by real Arduino now */ }
function resetDive(){ logDebug("Reset"); }
function playBuzzer(freq=2000,duration=150){ /* buzzer logic */ }
function pressButton(btn){ playBuzzer(2500,50); logDebug(`[HW] ${btn}`); }
function logDebug(msg){ const log=document.getElementById('debugLog'); const item=document.createElement('div'); item.className='debug-item'; item.innerText=`[${new Date().toLocaleTimeString()}] ${msg}`; log.appendChild(item); log.scrollTop=log.scrollHeight; }

window.onload = () => {
    logDebug("Real Arduino engine ready! Connect your ESP32 and paste your code.");
};
</script>
</body>
</html>
